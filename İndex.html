<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uçan Kalpler 🖤</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d0d0d;
            overflow: hidden;
            font-family: sans-serif;
            position: relative;
        }
        .container { text-align: center; z-index: 10; }
        .heart-box {
            width: 200px;
            height: 200px;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .heart-box:hover { transform: scale(1.1); }
        .heart-gif {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 42, 117, 0.7);
        }
        h1 { color: #fff; margin-top: 20px; font-size: 1.8rem; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        .floating-heart {
            position: absolute;
            color: #ff2a75;
            pointer-events: none;
            animation: floatUp 3s linear forwards;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 1; }
            100% { transform: translateY(-10vh) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart-box" onclick="createHeartExplosion(event)">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW9pZ3A1ZnJpY3Y4N3VvZXBqODN5b3VpZG9wZ3h5b3M0Ym9pZzZ5OCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/LMcBlsh88Fq7yVp88K/giphy.gif" alt="Kalp" class="heart-gif">
        </div>
        <h1>Seni Seviyorum... 🖤</h1>
    </div>

    <script>
        // Arka planda sürekli uçan kalpler (JavaScript)
        setInterval(() => {
            const heart = document.createElement('div');
            const icons = ['❤️', '💖', '🖤', '💕'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            heart.classList.add('floating-heart');
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 4000);
        }, 400);

        // GIF'e tıklayınca patlama efekti
        function createHeartExplosion(e) {
            for (let i = 0; i < 12; i++) {
                const h = document.createElement('div');
                h.innerText = '❤️';
                h.style.position = 'absolute';
                h.style.left = e.clientX + 'px';
                h.style.top = e.clientY + 'px';
                h.style.pointerEvents = 'none';
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 120 + 40;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                h.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${x}px, ${y}px) scale(0)`, opacity: 0 }
                ], { duration: 800, easing: 'ease-out', fill: 'forwards' });

                document.body.appendChild(h);
                setTimeout(() => h.remove(), 800);
            }
        }
    </script>
</body>
</html>
