<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Seviyorum... 🤍</title>
    <style>
        /* Tüm ekranı kaplayan siyah arka plan ayarları */
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d0d0d;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        .container { 
            text-align: center; 
            z-index: 10; 
        }

        /* Ortadaki Yuvarlak Fotoğraf Kutusu */
        .heart-box {
            width: 220px;
            height: 220px;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        /* Üzerine gelince hafifçe büyüme efekti */
        .heart-box:hover { 
            transform: scale(1.1); 
        }

        /* Fotoğrafın tam yuvarlak olması ve parlama efekti */
        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 42, 117, 0.7); /* Kırmızımsı pembe parlama */
            border: 3px solid rgba(255, 42, 117, 0.4);
        }

        /* Alttaki Yazı Stili */
        h1 { 
            color: #fff; 
            margin-top: 25px; 
            font-size: 1.8rem; 
            text-shadow: 0 0 10px rgba(255,255,255,0.4); 
            letter-spacing: 1px;
        }

        /* Koda eklediğimiz uçan kalplerin stili */
        .floating-heart {
            position: absolute;
            color: #ff2a75;
            pointer-events: none;
            animation: floatUp 3s linear forwards;
            z-index: 1;
        }

        /* Kalplerin aşağıdan yukarıya uçma animasyonu */
        @keyframes floatUp {
            0% { 
                transform: translateY(100vh) scale(0); 
                opacity: 1; 
            }
            100% { 
                transform: translateY(-10vh) scale(1.5); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart-box" onclick="createHeartExplosion(event)">
            <img src="resim.jpg" alt="Bizim Fotoğrafımız" class="profile-img">
        </div>
        <h1>Seni Seviyorum... 🖤</h1>
    </div>

    <script>
        // Arka planda sürekli kendiliğinden uçan kalpler (JavaScript)
        setInterval(() => {
            const heart = document.createElement('div');
            const icons = ['❤️', '💖', '🖤', '💕', '✨'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            heart.classList.add('floating-heart');
            
            // Ekranın rastgele bir yatay yerinden çıksın
            heart.style.left = Math.random() * 100 + 'vw';
            // Hızları birbirinden biraz farklı olsun
            heart.style.animationDuration = (Math.random() * 2 + 2) + 's';
            
            document.body.appendChild(heart);
            
            // Ekrandan çıkan kalpleri silerek siteyi yormasını engelliyoruz
            setTimeout(() => heart.remove(), 4000);
        }, 450);

        // Ortadaki fotoğrafa tıklayınca parmağının ucundan kalpler fırlama efekti
        function createHeartExplosion(e) {
            for (let i = 0; i < 12; i++) {
                const h = document.createElement('div');
                h.innerText = '❤️';
                h.style.position = 'absolute';
                h.style.left = e.clientX + 'px';
                h.style.top = e.clientY + 'px';
                h.style.pointerEvents = 'none';
                h.style.zIndex = '100';
                
                // Kalplerin dairesel olarak etrafa saçılması için matematiksel hesaplama
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 120 + 40;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                h.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${x}px, ${y}px) scale(0)`, opacity: 0 }
                ], { 
                    duration: 800, 
                    easing: 'ease-out', 
                    fill: 'forwards' 
                });

                document.body.appendChild(h);
                setTimeout(() => h.remove(), 800);
            }
        }
    </script>
</body>
</html>
