<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Film İzleme Merkezi</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b0e14;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            width: 100%;
            background: #1a1f2b;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border: 1px solid #2e3848;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        h1 small {
            font-size: 14px;
            font-weight: normal;
            color: #8896b0;
            margin-left: auto;
        }
        .admin-panel {
            background: #13181f;
            padding: 18px 20px;
            border-radius: 16px;
            margin: 20px 0 25px 0;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            border: 1px solid #2c3648;
        }
        .admin-panel h3 {
            font-size: 15px;
            color: #a0b3d9;
            margin-right: 8px;
            font-weight: 400;
        }
        .admin-panel input {
            flex: 1;
            min-width: 200px;
            padding: 12px 16px;
            border-radius: 40px;
            border: 1px solid #384458;
            background: #0b0e14;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }
        .admin-panel input:focus {
            border-color: #5a7cff;
            box-shadow: 0 0 0 3px rgba(90, 124, 255, 0.2);
        }
        .admin-panel button {
            padding: 12px 28px;
            border-radius: 40px;
            border: none;
            background: #5a7cff;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }
        .admin-panel button:hover {
            background: #3b5fd9;
            transform: scale(1.02);
        }
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 18px;
            background: #000;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.5);
        }
        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }
        .info-text {
            margin-top: 18px;
            font-size: 14px;
            color: #6a7b99;
            text-align: center;
            border-top: 1px solid #242d3d;
            padding-top: 18px;
        }
        .info-text span {
            color: #8aa4ff;
            font-weight: 500;
        }
        .status {
            font-size: 13px;
            color: #7ae0a0;
            margin-left: 10px;
        }
        @media (max-width: 600px) {
            .container { padding: 16px; }
            .admin-panel { flex-direction: column; align-items: stretch; }
            .admin-panel button { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            🎬 Film İzle
            <small>Doctor Strange 2026</small>
        </h1>

        <!-- YÖNETİM PANELİ (Link koyma yeri) -->
        <div class="admin-panel">
            <h3>🔗 Linki değiştir:</h3>
            <input type="text" id="videoInput" placeholder="Buraya embed linkini yapıştır...">
            <button onclick="updateVideo()">✅ Güncelle & İzle</button>
            <span id="statusMsg" class="status"></span>
        </div>

        <!-- VİDEO GÖSTERİCİ -->
        <div class="video-wrapper">
            <iframe id="videoFrame" src="" frameborder="0" allowfullscreen></iframe>
        </div>

        <div class="info-text">
            💡 Linki değiştirip "Güncelle"ye tıkla. Tarayıcı <span>kaydeder</span>, bir daha açtığında son eklediğin film gelir.
        </div>
    </div>

    <script>
        // Varsayılan olarak senin verdiğin Doctor Strange linkini embed formatına çevirdim.
        const DEFAULT_LINK = 'https://dzen.ru/embed/video/6676eac34d8a5017a7f36d43';
        
        const iframe = document.getElementById('videoFrame');
        const input = document.getElementById('videoInput');
        const statusMsg = document.getElementById('statusMsg');

        // Sayfa yüklendiğinde kayıtlı linki getir, yoksa default'u göster.
        function loadVideo() {
            let savedLink = localStorage.getItem('myMovieLink');
            
            // Eğer kayıtlı link yoksa veya boşsa default'u ata.
            if (!savedLink || savedLink.trim() === '') {
                savedLink = DEFAULT_LINK;
                localStorage.setItem('myMovieLink', savedLink);
            }

            input.value = savedLink;
            iframe.src = savedLink;
            statusMsg.textContent = '✅ Yüklendi';
        }

        // Kullanıcı linki güncellediğinde.
        function updateVideo() {
            let newLink = input.value.trim();
            
            if (newLink === '') {
                statusMsg.textContent = '❌ Lütfen bir link girin!';
                return;
            }

            // Basit bir kontrol: Eğer kullanıcı normal izleme linki verdiyse (watch/ içeriyorsa) embed'e çevirmeyi dene.
            // Ama kullanıcı direkt embed linki de verebilir, ona karışmayalım.
            if (newLink.includes('dzen.ru/video/watch/')) {
                const videoId = newLink.split('/').pop().split('?')[0];
                if (videoId && videoId.length > 5) {
                    newLink = `https://dzen.ru/embed/video/${videoId}`;
                    input.value = newLink; // Otomatik düzelt.
                }
            }

            // Kaydet ve iframe'e yükle.
            localStorage.setItem('myMovieLink', newLink);
            iframe.src = newLink;
            statusMsg.textContent = '✅ Link güncellendi!';
            
            // 2 saniye sonra status mesajını sadeleştir.
            setTimeout(() => {
                statusMsg.textContent = '✅ Yüklendi';
            }, 2000);
        }

        // Sayfa açılınca çalıştır.
        loadVideo();

        // Enter tuşuna basınca da güncellemesi için.
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                updateVideo();
            }
        });
    </script>
</body>
</html>
