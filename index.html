<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyiki Doğdun İyiki Varsın 🤍</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0d0d0d;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        .container { 
            text-align: center; 
            z-index: 10; 
        }

        .heart-box {
            width: 220px;
            height: 220px;
            min-width: 220px;
            min-height: 220px;
            margin: 0 auto;
            cursor: pointer;
            transition: transform 0.3s ease;
            display: block;
        }

        .heart-box:hover { 
            transform: scale(1.1); 
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 42, 117, 0.7);
            border: 3px solid rgba(255, 42, 117, 0.4);
            display: block;
        }

        h1 { 
            color: #fff; 
            margin-top: 25px; 
            font-size: 1.8rem; 
            text-shadow: 0 0 10px rgba(255,255,255,0.4); 
            letter-spacing: 1px;
        }

        /* Kalplerin yukarıdan aşağıya inmesi için yeni stil */
        .floating-heart {
            position: absolute;
            color: #ff2a75;
            pointer-events: none;
            animation: floatDown 4s linear forwards;
            z-index: 1;
        }

        /* Kalpler yukarıdan (-10vh) başlayıp aşağıya (110vh) inecek */
        @keyframes floatDown {
            0% { 
                transform: translateY(-10vh) scale(0); 
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 0.8;
            }
            100% { 
                transform: translateY(110vh) scale(1.3); 
                opacity: 0; 
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="heart-box" onclick="createHeartExplosion(event)">
            <img src="https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=600&auto=format&fit=crop" alt="Kalp" class="profile-img">
        </div>
        <h1>İyiki Doğdun İyiki Varsın 🤍</h1>
    </div>

    <script>
        // Arka planda yukarıdan aşağıya süzülen kalpler
        setInterval(() => {
            const heart = document.createElement('div');
            const icons = ['❤️', '💖', '🖤', '💕', '✨'];
            heart.innerText = icons[Math.floor(Math.random() * icons.length)];
            heart.classList.add('floating-heart');
            
            // Ekranın üst kısmında rastgele bir yatay hizadan başlasın
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '0px'; 
            
            // Düşüş hızları birbirinden biraz farklı olsun
            heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
            
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }, 350);

        // Ortaya tıklayınca etrafa saçılan kalpler efekti
        function createHeartExplosion(e) {
            for (let i = 0; i < 12; i++) {
                const h = document.createElement('div');
                h.innerText = '❤️';
                h.style.position = 'absolute';
                h.style.left = e.clientX + 'px';
                h.style.top = e.clientY + 'px';
                h.style.pointerEvents = 'none';
                h.style.zIndex = '100';
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 120 + 40;
                const x = Math.cos(angle) * dist;
                const y = Math.sin(angle) * dist;

                h.animate([
                    { transform: 'translate(0, 0) scale(1)', opacity: 1 },
                    { transform: `translate(${x}px, ${y}px) scale(0)`, opacity: 0 }
                ], { 
                    duration: 800, 
                    easing: 'ease-out', 
                    fill: 'forwards' 
                });

                document.body.appendChild(h);
                setTimeout(() => h.remove(), 800);
            }
        }
    </script>
</body>
</html>
